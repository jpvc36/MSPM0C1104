#!/bin/sh
THD_SOCKET=/tmp/triggerhappy.socket
[ -S "$THD_SOCKET" ] || exit

case "$ACTION" in
	add)
		DEVICE="/dev/$DEVNAME"
		[ -c "$DEVICE" ] || exit
		# offer device to triggerhappy daemon
		/usr/sbin/th-cmd --socket "$THD_SOCKET" --add "$DEVICE"
	;;
        remove)
		# nothing to do
	;;
esac
